server {
    listen      80;
    listen      [::]:80;
    server_name localhost;
    
    root                    /app/dist;

    # logging
    access_log              /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log               /var/log/nginx/error.log warn;

    # reverse proxy
    location /api {
        resolver 127.0.0.11;
        proxy_ssl_server_name on;
        proxy_pass $BACKEND_URL;
    }

    # index.html fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}